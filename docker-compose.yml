services:
  db:
    image: mysql:8.0
    container_name: officehub-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: officedb
      MYSQL_USER: officeuser
      MYSQL_PASSWORD: officepass123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: officehub-backend
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: officeuser
      MYSQL_PASSWORD: officepass123
      MYSQL_DATABASE: officedb
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: officehub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
